{% extends 'base.html' %}{% block title %}Manage Categories{% endblock %}{% block content %}<section class="admin-section"><div class="container narrow"><div class="eyebrow">MANAGEMENT AREA</div><h1>Tour <em>categories.</em></h1>{% include '_admin_nav.html' %}<form class="form-card" action="/admin/categories" method="post"><input type="hidden" name="csrf" value="{{csrf}}"><h3>Add a new category / tab</h3><label>Category name<input name="name" required placeholder="e.g. Honeymoon"></label><label>Short description<input name="description" placeholder="e.g. Romantic getaways"></label><button class="btn btn-primary">Add Category ↗</button></form><div class="table-scroll spaced"><table class="data-table"><thead><tr><th>Category</th><th>Description</th><th>Action</th></tr></thead><tbody>{% for cat in categories %}<tr><td>{{cat.name}}</td><td>{{cat.description}}</td><td><form method="post" action="/admin/categories/{{cat.id}}/delete" onsubmit="return confirm('Delete category? Existing tours will become uncategorised.')"><input type="hidden" name="csrf" value="{{csrf}}"><button class="small-btn danger">Delete</button></form></td></tr>{% endfor %}</tbody></table></div></div></section>{% endblock %}
