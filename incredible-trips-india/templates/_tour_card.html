<article class="tour-card"><a href="/tours/{{tour.slug}}" class="tour-img" {% if tour.image %}style="background-image:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.18)),url('{{tour.image}}')"{% endif %}><span class="pill">{{tour.category or 'Discover India'}}</span></a><div class="tour-info"><div class="tour-state">📍 {{tour.state}}</div><h3><a href="/tours/{{tour.slug}}">{{tour.title}}</a></h3><p>{{tour.destination}}</p><div class="tour-meta"><span>◷ {{tour.duration}}</span><span>✦ Customisable</span></div><div class="tour-bottom"><div><small>Starting from</small><strong>{% if tour.price %}₹{{'{:,}'.format(tour.price)}}{% else %}On request{% endif %}</strong><small>{% if tour.price %}/ person*{% endif %}</small></div><a class="circle-arrow" href="/tours/{{tour.slug}}" aria-label="View {{tour.title}}">↗</a></div></div></article>
