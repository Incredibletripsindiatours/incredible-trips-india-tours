{% extends 'base.html' %}{% block title %}{{'Edit Tour' if tour else 'Add Tour'}}{% endblock %}{% block content %}<section class="admin-section"><div class="container narrow"><div class="eyebrow">MANAGEMENT AREA</div><h1>{{'Edit' if tour else 'Add'}} <em>tour.</em></h1>{% include '_admin_nav.html' %}<form class="form-card admin-form" method="post" action="/admin/tours/save" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{csrf}}"><input type="hidden" name="tour_id" value="{{tour.id if tour else 0}}"><div class="form-row"><label>Tour title *<input name="title" required value="{{tour.title if tour else ''}}"></label><label>Category *<select name="category_id" required>{% for cat in categories %}<option value="{{cat.id}}" {% if tour and tour.category_id==cat.id %}selected{% endif %}>{{cat.name}}</option>{% endfor %}</select></label></div><div class="form-row"><label>Destinations / route *<input name="destination" required value="{{tour.destination if tour else ''}}" placeholder="Jaipur • Udaipur"></label><label>State / region *<input name="state" required value="{{tour.state if tour else ''}}"></label></div><div class="form-row"><label>Duration *<input name="duration" required value="{{tour.duration if tour else ''}}" placeholder="5 Days / 4 Nights"></label><label>Starting price per person (₹)<input name="price" type="number" min="0" value="{{tour.price if tour else 0}}"></label></div><label>Short description *<textarea name="description" required rows="4">{{tour.description if tour else ''}}</textarea></label><label>Highlights (one per line)<textarea name="highlights" rows="5">{{tour.highlights if tour else ''}}</textarea></label><label>Itinerary (one day per line)<textarea name="itinerary" rows="8">{{tour.itinerary if tour else ''}}</textarea></label><label>Image URL (or upload below)<input name="image_url" value="{{tour.image if tour else ''}}" placeholder="https://..."></label><label>Upload a new image (JPG, PNG, WebP, max 5MB)<input type="file" name="image" accept="image/jpeg,image/png,image/webp"></label>{% if tour and tour.image %}<img class="admin-preview" src="{{tour.image}}" alt="Current tour image">{% endif %}<div class="checkbox-row"><label><input type="checkbox" name="featured" {% if tour and tour.featured %}checked{% endif %}> Featured on homepage</label><label><input type="checkbox" name="active" {% if not tour or tour.active %}checked{% endif %}> Published / visible</label></div><button class="btn btn-primary">Save Tour ↗</button></form></div></section>{% endblock %}
